[project]
name = "ratifact"
version = "1.0.0rc1"
description = "Local MCP server that turns each repository into the persistent memory of its project."
readme = "LEEME.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
ratifact = "ratifact.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratifact"]

[tool.hatch.build.targets.sdist]
include = ["ratifact", "LEEME.md", "pyproject.toml"]

# Las pruebas corren con `uv run --with pytest --with "mcp>=1.2,<2" pytest -q` desde la copia de trabajo, sin crear
# un entorno del proyecto (.venv/uv.lock): el paquete se instala con `uv tool install <ruta del repo>`.
[tool.uv]
managed = false
